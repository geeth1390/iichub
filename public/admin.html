<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ProtoHub — Admin Console</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--steel-900:#172B3A;--steel-700:#294354;--steel-500:#62717A;
--steel-300:#A7B2B0;--steel-100:#E1E8E2;--steel-50:#F0F3EF;
--paper:#F8F7F2;--safety:#91A895;--oxide:#B96F55;
--verd:#527B69;--line:#D7DED8
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--steel-900);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:auto;padding:0 24px}
header{background:var(--steel-900);color:white;border-bottom:3px solid var(--safety)}
.hbar{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap}
.mark{font-family:'Archivo Narrow';font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.mark span{color:var(--safety)}
.console-tag{font-family:'JetBrains Mono';font-size:10px;color:var(--steel-900);background:var(--safety);padding:3px 8px;letter-spacing:.1em}
.whoami{margin-left:auto;text-align:right;font-size:12px;color:var(--steel-300)}
.whoami b{color:white;font-family:'Archivo Narrow';font-size:14px}
nav.tabs{background:#20394A}
nav.tabs .wrap{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{background:none;color:var(--steel-300);padding:11px 16px;font-size:14px;border-bottom:3px solid transparent;border-radius:0}
nav.tabs button.on{color:white;border-bottom-color:var(--safety)}
main{padding:24px 0 80px}
h2{font-family:'Archivo Narrow';font-size:22px;font-weight:600;margin-bottom:4px}
.sub{color:var(--steel-500);margin-bottom:16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:13px Inter,sans-serif;background:white}
.toolbar .grow{flex:1}
button{font-family:'Archivo Narrow';cursor:pointer;border:none;letter-spacing:.04em;text-transform:uppercase;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed}
.btn{padding:8px 14px;background:var(--steel-900);color:white;font-weight:600;font-size:13px}
.btn:hover{background:var(--verd)}
.btn.primary,.btn.go{background:var(--safety);color:var(--steel-900)}
.btn.ghost{background:white;color:var(--steel-900);border:1px solid var(--line)}
.btn.danger{background:white;color:var(--oxide);border:1px solid var(--oxide)}
.btn.sm{padding:5px 9px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.card{background:#FFFEFA;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card b{display:block;font-family:'Archivo Narrow';font-size:28px;line-height:1.1}
.card span{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.06em;color:var(--steel-500);text-transform:uppercase}
.card.alert{border-color:var(--oxide)}.card.alert b{color:var(--oxide)}
.tablewrap{background:#FFFEFA;border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-500);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--steel-50)}
td{padding:9px 12px;border-bottom:1px solid var(--steel-50);vertical-align:top}
tr:last-child td{border-bottom:none}
td.actions{white-space:nowrap;text-align:right}
td.actions .btn{margin-left:4px}
.muted{color:var(--steel-500);font-size:12px}
.pill{display:inline-block;font-family:'JetBrains Mono';font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill.super_admin{background:#172B3A;color:white;border-color:#172B3A}
.pill.apis_admin{background:#294354;color:white;border-color:#294354}
.pill.centre_manager{border-color:var(--verd);color:var(--verd)}
.pill.off,.pill.rejected,.pill.suspended{border-color:var(--oxide);color:var(--oxide)}
.pill.pending{background:#fff4cc;border-color:#e6d38a;color:#6b5600}
.pill.verified,.pill.live{border-color:var(--verd);color:var(--verd)}
.empty{padding:28px;text-align:center;color:var(--steel-500)}
.section{margin-bottom:30px}
.modal{position:fixed;inset:0;background:rgba(14,30,40,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal.on{display:flex}
.sheet{background:#FFFEFA;width:100%;max-width:620px;border-radius:14px;border-top:5px solid var(--safety)}
.shead{padding:20px 22px 8px}.shead h3{font-family:'Archivo Narrow';font-size:21px}
.shead p{color:var(--steel-500);font-size:13px}
.sbody{padding:8px 22px 6px}
.sfoot{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--steel-500);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:14px Inter,sans-serif;background:white}
.field .hint{font-size:11.5px;color:var(--steel-500);margin-top:3px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0 12px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--steel-900)}
.message{font-size:13px;color:var(--oxide);margin:6px 0;white-space:pre-wrap}
.message.ok{color:var(--verd)}
.secret{font-family:'JetBrains Mono';font-size:20px;letter-spacing:.06em;background:var(--steel-50);border:1px dashed var(--steel-500);padding:14px;text-align:center;border-radius:10px;margin:10px 0;user-select:all}
.toast{position:fixed;right:18px;bottom:18px;background:var(--steel-900);color:white;padding:12px 16px;border-left:4px solid var(--safety);border-radius:9px;display:none;max-width:380px;z-index:60}
.toast.on{display:block}
.login-screen{position:fixed;inset:0;background:rgba(14,30,40,.92);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.login-card{background:#FFFEFA;width:100%;max-width:420px;padding:28px;border-top:5px solid var(--safety);border-radius:14px}
.login-card h2{margin-bottom:4px}
.login-card p{color:var(--steel-500);font-size:13px;margin-bottom:14px}
.login-card .btn{width:100%;padding:12px;margin-top:4px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h2>ProtoHub Admin</h2>
    <p>For administrators and centre managers.</p>
    <div id="emailStep" data-form>
      <div class="field"><label for="emailInput">Email</label>
        <input id="emailInput" type="email" autocomplete="username" maxlength="254"></div>
      <div class="field"><label for="passwordInput">Password</label>
        <input id="passwordInput" type="password" autocomplete="current-password" maxlength="128"></div>
      <button id="loginBtn" class="btn primary" data-act="doLogin">Sign in</button>
    </div>
    <div id="passwordStep" class="hidden" data-form>
      <div class="field"><label for="tempInput">Temporary password</label>
        <input id="tempInput" type="password" autocomplete="current-password" maxlength="128"></div>
      <div class="field"><label for="newInput">New password (at least 10 characters)</label>
        <input id="newInput" type="password" autocomplete="new-password" maxlength="128">
        <div class="hint">Admins: use 14+ characters, e.g. four random words.</div></div>
      <div class="field"><label for="new2Input">Type it again</label>
        <input id="new2Input" type="password" autocomplete="new-password" maxlength="128"></div>
      <button id="setPwBtn" class="btn primary" data-act="doSetPassword">Save password</button>
    </div>
    <div id="loginMessage" class="message"></div>
  </div>
</div>

<header>
  <div class="wrap hbar">
    <div class="mark">Proto<span>Hub</span></div>
    <div class="console-tag">ADMIN</div>
    <div class="whoami"><b id="meName">—</b><br><span id="meRole"></span></div>
    <a class="btn ghost" href="/manager">Manager console</a>
    <button class="btn" data-act="logout">Sign out</button>
  </div>
</header>
<nav class="tabs"><div class="wrap" id="tabs"></div></nav>

<main><div class="wrap" id="view"></div></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
